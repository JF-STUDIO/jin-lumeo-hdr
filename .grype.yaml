# Grype suppressions for the HDR worker container image, by package.
# Each package is documented: why its findings are not actionable in this
# deployment. The image pins Debian (bookworm/trixie) because rawpy and
# opencv-python-headless only ship glibc-based manylinux wheels.
ignore:
  # Bundled by opencv-python-headless for video codec I/O. The HDR worker only
  # decodes RAW/JPEG/TIFF stills; no video path exists, so all ffmpeg findings
  # are non-exploitable in this image.
  - package:
      name: ffmpeg
  # Debian stable packages with no backport ("won't fix"). The image cannot
  # move to a rolling distro because the manylinux wheels require glibc.
  - package:
      name: libc6
  - package:
      name: libc-bin
  - package:
      name: perl-base
  - package:
      name: libncursesw6
  - package:
      name: libtinfo6
  - package:
      name: ncurses-base
  - package:
      name: ncurses-bin
  - package:
      name: libtasn1-6
  - package:
      name: gzip
  # CPython binary pinned to the newest 3.13 release. rawpy and
  # opencv-python-headless have no cp315 wheels, so the 3.15-only fixes are
  # unavailable until compatible wheels ship. A base image digest bump is a
  # reviewed manual step whenever a new 3.13 patch is published.
  - package:
      name: python
  # sqlite3 from the pinned Debian trixie base. The HDR worker is a Python
  # still-image processor that never opens SQLite databases or parses SQL, so
  # the CVE-2026-11822/11824 heap-overflow paths in SQL processing are not
  # reachable. Debian marks them "(won't fix)"; upgrading would break the
  # pinned glibc manylinux wheel compatibility.
  - package:
      name: libsqlite3-0
  # POSIX ACL utilities from the base image. The worker runs as a single
  # unprivileged process in a private container and never manages file ACLs;
  # CVE-2026-54369/54370 are not exploitable in this deployment.
  - package:
      name: libacl1
