name: build-hdr
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install syft and grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Build, scan and evidence HDR image
        env:
          HDR_BASE_IMAGE: python:3.13.14-slim-trixie@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
        run: node scripts/hdr-container-evidence.mjs --build
      - name: Compare grype source resolution
        if: failure()
        run: |
          pwd && ls -la .grype.yaml || true
          grype ghcr.io/jf-studio/jin-lumeo-hdr:latest -o table --fail-on high --config .grype.yaml; echo 'BARE_EXIT='$?
          grype docker:ghcr.io/jf-studio/jin-lumeo-hdr:latest -o table --fail-on high --config .grype.yaml; echo 'DOCKER_EXIT='$?
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/jf-studio/jin-lumeo-hdr:latest ghcr.io/jf-studio/jin-lumeo-hdr:sha-${GITHUB_SHA:0:8}
          docker push ghcr.io/jf-studio/jin-lumeo-hdr:latest
          docker push ghcr.io/jf-studio/jin-lumeo-hdr:sha-${GITHUB_SHA:0:8}
